<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!--
      Title + description are hardcoded here (not pulled from src/config.js)
      because index.html is read by browsers/crawlers before React ever runs.
      If you reuse this site for a different salon, update these two tags
      AND src/config.js so they stay in sync.
    -->
    <title>Doghonest Grooming | Dog Grooming in Coachella, CA</title>
    <meta
      name="description"
      content="Doghonest Grooming offers gentle, one-on-one dog grooming in Coachella, CA. Full grooms, baths and blow dries, nail trims, ear cleaning and more. Call (760) 238-2167."
    />

    <link rel="icon" type="image/webp" href="/assets/logo.webp" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
